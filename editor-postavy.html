<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#c8102e">
  <title>Blavačík – editor postavy</title>
  <link rel="icon" type="image/svg+xml" href="assets/ui/favicon.svg">
  <link rel="stylesheet" href="css/editor-postavy.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <div id="editor">
    <div id="scena"><div id="nacitava">Načítavam Ďoďa…</div></div>
    <aside id="panel">
      <h1><img src="assets/ui/logo.svg" alt="" class="logo"> Ďoďo</h1>
      <p class="pozn">Meno, povaha aj reč ostávajú – vždy je to Ďoďo. Ťahaním postavy ju otočíš.</p>
      <div id="ovladanie"></div>
      <div class="tlacidla">
        <button id="povodny" type="button">Pôvodný Ďoďo</button>
        <button id="hrat" type="button" class="hlavne">Uložiť a hrať</button>
      </div>
    </aside>
  </div>
  <noscript>Editor potrebuje zapnutý JavaScript.</noscript>
  <script type="module" src="js/chodec/editor-postavy.js"></script>
</body>
</html>
