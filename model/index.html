<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model mesta – skúšobné územie</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe7ec; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #panel { position: fixed; top: 12px; left: 12px; background: rgba(255,255,255,.92); border-radius: 8px; padding: 10px 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.15); font-size: 13px; color: #222; max-width: 320px; }
    #panel h1 { font-size: 15px; margin: 0 0 6px; }
    #varianty button { font: inherit; padding: 5px 9px; margin: 0 4px 4px 0; border: 1px solid #9aa; border-radius: 5px; background: #f4f6f7; cursor: pointer; }
    #varianty button.aktivny { background: #2f5d8a; color: #fff; border-color: #2f5d8a; }
    #legenda { margin-top: 6px; display: grid; grid-template-columns: 14px 1fr; gap: 3px 6px; align-items: center; }
    #legenda span.f { width: 14px; height: 12px; border-radius: 2px; border: 1px solid rgba(0,0,0,.2); }
    #napoveda { margin-top: 8px; color: #555; font-size: 12px; line-height: 1.4; }
    #zdroje { position: fixed; right: 8px; bottom: 6px; font-size: 11px; color: #333; background: rgba(255,255,255,.75); padding: 3px 6px; border-radius: 4px; }
    #stav { margin-top: 6px; color: #2f5d8a; font-size: 12px; }
  </style>
  <script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js" } }</script>
</head>
<body>
  <div id="panel">
    <h1>Model mesta – Staré Mesto, nábrežie, Petržalka</h1>
    <div id="varianty">
      <button data-v="1">1 · terén</button><button data-v="2">2 · + budovy</button><button data-v="3">3 · + cesty a plochy</button><button data-v="4">4 · všetko</button>
    </div>
    <div id="legenda"></div>
    <div id="stav"></div>
    <div id="napoveda">Ľavé tlačidlo myši – otáčanie, pravé – posun, koliesko – priblíženie.<br>
      W A S D – pohyb, Q / E – dolu / hore, 1–4 – variant.</div>
  </div>
  <div id="zdroje">Terén a výšky: laserové skenovanie © ÚGKK SR (CC BY 4.0) · Mapa: © prispievatelia OpenStreetMap (ODbL)</div>
  <script type="module" src="js/hlavna.js"></script>
</body>
</html>
